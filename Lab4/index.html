<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JQuery</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
  <script src="index.js" defer></script>
  <link rel="stylesheet" href="index.css">
</head>
<body>
    <form>
      <label for="firstName">First Name:</label><br>
      <input type="text" id="firstName" name="firstName">
      <br>

      <label for="lastName">Last Name:</label><br>
      <input type="text" id="lastName" name="lastName">
      <br>

      <label for="email">Email:</label><br>
      <input type="text" id="email" name="email">
      <br>

      <label for="description">Description:</label><br>
      <input type="text" id="description" name="description">
      <br>

      <label for="observations">Observations:</label><br>
      <input type="text" id="observations" name="observations">
      <br>

      <button id="clickMeBtn">Click me</button>
    </form>

    <div id="grayDiv">

    </div>

    <div id="modalWindow">
        <div class="modalWindowContainer">
          <div class="modalWindowInputContainer">
            <label for="club">Club</label>
            <br>
            <input type="text" name="club" class="clubInput">
          </div>
          <div class="modalWindowInputContainer">
            <label for="nationality">Nationality</label>
            <br>
            <input type="text" name="nationality" class="nationalityInput">
          </div>
          <div class="modalWindowInputContainer">
            <label for="position">Position</label>
            <br>
            <input type="text" name="position" class="positionInput">
          </div>
          <div class="modalWindowInputContainer">
            <label for="fullName">Full Name</label>
            <br>
            <input type="text" name="fullName" class="fullNameInput">
          </div>
          <button class="submitButton">Submit</button>
        </div>
    </div>
</body>
</html>
