<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <h1>Documents</h1>
  <button id="show-all-btn">Show all</button>
  <div>
    <label for="type">Type</label><br>
    <input type="text" name="type" id="type">
    <button id="show-by-type-btn">Filter by type</button>
  </div>
  <div>
    <label for="type">Format</label><br>
    <input type="text" name="format" id="format">
    <button id="show-by-format-btn">Filter by format</button>
  </div>
  <h3 id="filter-information">Showing all</h3>
  <table class="tbl" id="documents-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Number of Pages</th>
        <th>Type</th>
        <th>Format</th>
        <th>Author Id</th>
      </tr>
    </thead>
    <tbody>
      
    </tbody>
  </table>

  <button id="go-home-btn">Home</button>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="./js/list_documents.js"></script>
</body>
</html>
