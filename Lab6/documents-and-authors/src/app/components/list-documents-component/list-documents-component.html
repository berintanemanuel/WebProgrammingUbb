<h1>Documents</h1>
<button (click)="loadDocuments('all')">Show all</button>

<div>
  <label>Type</label><br>
  <input type="text" [(ngModel)]="typeInput">
  <button (click)="loadDocuments('type', typeInput)">Filter by type</button>
</div>

<div>
  <label>Format</label><br>
  <input type="text" [(ngModel)]="formatInput">
  <button (click)="loadDocuments('format', formatInput)">Filter by format</button>
</div>

<h3>{{ filterText }}</h3>

<table class="tbl">
  <thead>
    <tr>
      <th>ID</th><th>Title</th><th>Pages</th><th>Type</th><th>Format</th><th>Author</th><th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let doc of documents;">
      <td>{{ doc.id }}</td>
      <td>{{ doc.title }}</td>
      <td>{{ doc.nopages }}</td>
      <td>{{ doc.type }}</td>
      <td>{{ doc.format }}</td>
      <td>{{ doc.author_id }}</td>
      <td>
        <button (click)="onEdit(doc.id)">Edit</button>
        <button (click)="onDelete(doc.id)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>

<button routerLink="/">Home</button>
